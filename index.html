<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabalhando com Tabelas</title>
    <style>
      table {
        border: 1px solid gray;
      }
      table td{
        text-align: center;
      }
      table thead th {
        background-color: black;
        color: white;
      }
      table tfoot td {
        background-color:lightgray;
      }
      table tbody tr:nth-child(even) {
        background-color: #f1f1f1;
      }
      table tbody tr:hover {
        background-color: #e9e9e9;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <table summary="Tabela de Idades" width="250" align="center" cellspacing="0" cellpadding="5">
      <thead>
        <tr>
          <th colspan="2">Tabela de Idades</th>
        </tr>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Fabio</td>
          <td>33</td>
        </tr>
        <tr>
          <td>Renata</td>
          <td>30</td>
        </tr>
        <tr>
          <td>Rafael</td>
          <td>27</td>
        </tr>
        <tr>
          <td>Alexandre</td>
          <td>27</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td><strong>Total</strong></td>
          <td><strong>4</strong></td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
